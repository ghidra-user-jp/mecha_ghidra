services:
  ghidra-mcp:
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    build:
      context: .
      args:
        TARGETPLATFORM: ${DOCKER_PLATFORM:-linux/amd64}
        GHIDRA_DIST_URL: ${GHIDRA_DIST_URL-}
        GHIDRA_DIST_SHA256: ${GHIDRA_DIST_SHA256-}
        GHIDRA_DECOMPILER_NATIVES_URL: ${GHIDRA_DECOMPILER_NATIVES_URL-}
        GHIDRA_DECOMPILER_NATIVES_SHA256: ${GHIDRA_DECOMPILER_NATIVES_SHA256-}
    image: ghidra-mcp:local
    ports:
      # Keep the unauthenticated MCP endpoint local by default. Operators who
      # intentionally expose it must add TLS and access controls explicitly.
      - "127.0.0.1:8081:8081"
    environment:
      GHIDRA_INSTALL_DIR: /opt/ghidra
      GHIDRA_SERVER_PASSWORD: ${GHIDRA_SERVER_PASSWORD:-}
    volumes:
      - ./samples:/samples:ro
      - ghidra-projects:/data/projects

volumes:
  ghidra-projects:
