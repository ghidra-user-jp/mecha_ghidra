services:
  mecha_ghidra:
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    build:
      context: .
      args:
        TARGETPLATFORM: ${DOCKER_PLATFORM:-linux/amd64}
        GHIDRA_DIST_URL: ${GHIDRA_DIST_URL-}
        GHIDRA_DIST_SHA256: ${GHIDRA_DIST_SHA256-}
        GHIDRA_DECOMPILER_NATIVES_URL: ${GHIDRA_DECOMPILER_NATIVES_URL-}
        GHIDRA_DECOMPILER_NATIVES_SHA256: ${GHIDRA_DECOMPILER_NATIVES_SHA256-}
    image: mecha_ghidra:local
    restart: unless-stopped
    # On stop the server cancels a running analysis (an import or analyze_program
    # job), rolls the program back and closes the projects; the default 10 s grace
    # period can cut that short with SIGKILL.
    stop_grace_period: 120s
    user: "10001:10001"
    ports:
      # Keep the unauthenticated MCP endpoint local by default. Operators who
      # intentionally expose it must add TLS and access controls explicitly.
      - "127.0.0.1:8081:8081"
    environment:
      GHIDRA_INSTALL_DIR: /opt/ghidra
      GHIDRA_SERVER_PASSWORD: ${GHIDRA_SERVER_PASSWORD:-}
    volumes:
      - ./samples:/samples:ro
      # Operator-trusted Ghidra scripts; enable with --add-category scripts --script-root /data/scripts.
      - ./ghidra_scripts:/data/scripts:ro
      - ./exports:/data/exports
      - ghidra-projects:/data/projects

volumes:
  ghidra-projects:
