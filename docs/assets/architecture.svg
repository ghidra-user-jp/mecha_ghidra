<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="458" viewBox="0 0 1040 458" role="img" aria-labelledby="title desc">
  <title id="title">Mecha Ghidra architecture and analysis flow</title>
  <desc id="desc">In the basic setup, an MCP client requests analysis and Mecha Ghidra runs Ghidra without a GUI and returns results. Analysis data and edits are stored in a local Ghidra project. Optional connections, shown as dashed lines, let Mecha Ghidra query BSim for similar functions and shared projects exchange analysis data with Ghidra Server.</desc>
  <g font-family="'Inter', 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif" fill="#253247">
    <text x="24" y="32" font-size="15" font-weight="500" text-anchor="start" fill="#5e7087">Basic setup</text>
    <rect x="24" y="68" width="240" height="132" fill="#f6f8fb" stroke="#cbd5e1" stroke-width="1.25" rx="10" />
    <path d="M46 153H242" fill="none" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
    <text x="46" y="105" font-size="20" font-weight="500" text-anchor="start" fill="#253247">MCP client</text>
    <text x="46" y="136" font-size="14" font-weight="400" text-anchor="start" fill="#475569">Ask AI and read the results</text>
    <text x="46" y="178" font-size="12" font-weight="400" text-anchor="start" fill="#5e7087">Codex / Claude Code</text>
    <rect x="392" y="68" width="240" height="132" fill="#edf3fa" stroke="#a3bddc" stroke-width="1.25" rx="10" />
    <path d="M414 153H610" fill="none" stroke="#dbe7f5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
    <text x="414" y="105" font-size="20" font-weight="500" text-anchor="start" fill="#244a7c">Mecha Ghidra</text>
    <text x="414" y="136" font-size="14" font-weight="400" text-anchor="start" fill="#475569">Analyze and edit with Ghidra</text>
    <text x="414" y="178" font-size="12" font-weight="400" text-anchor="start" fill="#5e7087">No GUI · Uses PyGhidra</text>
    <rect x="760" y="68" width="256" height="132" fill="#f6f8fb" stroke="#cbd5e1" stroke-width="1.25" rx="10" />
    <path d="M782 153H994" fill="none" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
    <text x="782" y="105" font-size="20" font-weight="500" text-anchor="start" fill="#253247">Ghidra project</text>
    <text x="782" y="136" font-size="14" font-weight="400" text-anchor="start" fill="#475569">Store analysis data and edits</text>
    <text x="782" y="178" font-size="12" font-weight="400" text-anchor="start" fill="#5e7087">Local · .gpr / .rep</text>
    <path d="M276 119H380M374 114l6 5-6 5" fill="none" stroke="#5479a7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="328" y="106" font-size="13" font-weight="400" text-anchor="middle" fill="#5e7087">Request analysis</text>
    <path d="M276 157H380M282 152l-6 5 6 5" fill="none" stroke="#8a98aa" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="328" y="180" font-size="13" font-weight="400" text-anchor="middle" fill="#5e7087">Return results</text>
    <path d="M644 119H748M650 114l-6 5 6 5" fill="none" stroke="#8a98aa" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="696" y="106" font-size="13" font-weight="400" text-anchor="middle" fill="#5e7087">Read data</text>
    <path d="M644 157H748M742 152l6 5-6 5" fill="none" stroke="#5479a7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="696" y="180" font-size="13" font-weight="400" text-anchor="middle" fill="#5e7087">Save changes</text>
    <text x="24" y="288" font-size="15" font-weight="500" text-anchor="start" fill="#5e7087">Optional features</text>
    <text x="24" y="316" font-size="13" font-weight="400" text-anchor="start" fill="#5e7087">Connect only the features you need</text>
    <path d="M24 344H58" fill="none" stroke="#8a98aa" stroke-width="1.3" stroke-dasharray="5 5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="69" y="349" font-size="13" font-weight="400" text-anchor="start" fill="#5e7087">Optional connection</text>
    <path d="M512 212V332" fill="none" stroke="#8a98aa" stroke-width="1.3" stroke-dasharray="5 5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M507 218l5-6 5 6M507 326l5 6 5-6" fill="none" stroke="#8a98aa" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
    <text x="530" y="278" font-size="13" font-weight="400" text-anchor="start" fill="#5e7087">Query functions</text>
    <path d="M888 212V332" fill="none" stroke="#8a98aa" stroke-width="1.3" stroke-dasharray="5 5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M883 218l5-6 5 6M883 326l5 6 5-6" fill="none" stroke="#8a98aa" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
    <text x="906" y="268" font-size="13" font-weight="400" text-anchor="start" fill="#5e7087">Get / share</text>
    <text x="906" y="291" font-size="13" font-weight="400" text-anchor="start" fill="#5e7087">analysis data</text>
    <rect x="392" y="344" width="240" height="90" fill="#f6f8fb" stroke="#cbd5e1" stroke-width="1.25" rx="10" />
    <text x="414" y="381" font-size="20" font-weight="500" text-anchor="start" fill="#253247">BSim</text>
    <text x="414" y="412" font-size="14" font-weight="400" text-anchor="start" fill="#475569">Find similar functions</text>
    <rect x="760" y="344" width="256" height="90" fill="#f6f8fb" stroke="#cbd5e1" stroke-width="1.25" rx="10" />
    <text x="782" y="381" font-size="20" font-weight="500" text-anchor="start" fill="#253247">Ghidra Server</text>
    <text x="782" y="412" font-size="14" font-weight="400" text-anchor="start" fill="#475569">Share analysis with your team</text>
  </g>
</svg>
