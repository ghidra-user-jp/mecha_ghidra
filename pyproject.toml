[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ghidra-mcp"
version = "0.1.4rc1"
description = "Headless Ghidra MCP server built on PyGhidra (PyGhidra ベースの Ghidra MCP サーバー)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["ghidra", "mcp", "reverse-engineering", "pyghidra", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Disassemblers",
]
dependencies = [
    "mcp>=2.1.1,<3",
    "pyghidra>=2.0.0",
    "fasteners>=0.19",
    "pydantic>=2.11,<3",
    "regex>=2024.4.16",
]

[project.urls]
Homepage = "https://github.com/ghidra-user-jp/mecha_ghidra"
Repository = "https://github.com/ghidra-user-jp/mecha_ghidra"
Documentation = "https://github.com/ghidra-user-jp/mecha_ghidra/blob/main/docs/usage.md"
Issues = "https://github.com/ghidra-user-jp/mecha_ghidra/issues"

[project.scripts]
ghidra-mcp = "ghidra_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
managed = true

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-mock>=3",
]
dev = [
    "pytest>=8",
    "pytest-mock>=3",
    "ruff>=0.14",
    "packaging>=24",
]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["build", "dist", "dist-ci-repro", "samples"]

[tool.ruff.lint]
# Correctness and modernization rules that the code base is expected to satisfy.
# Style-only families (ANN, D, ...) are intentionally left out; `noqa` markers for
# rules that are not enabled are themselves flagged (RUF100) so they cannot rot.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "S", "BLE", "TRY", "PIE", "T20"]
ignore = [
    "E501",    # line length is handled by the formatter
    "PLR0913", "PLR0912", "PLR0915", "PLR0911", "PLR2004", "PLR0914", "PLR0917", "PLR6301", "PLR1702",
    "PLC0415", # late imports are used deliberately for optional JVM/adapter dependencies
    "PLW0603", # module-level caches for JVM classes
    "S101",    # asserts are fine in tests and internal invariants
    "TRY003", "TRY004", "TRY300", "TRY301", "TRY400",
    "SIM102", "SIM108", "SIM113", "SIM117",
    "RUF012", "RUF005", "RUF022",
    "B904", "B905", "B008",
    "UP007", "UP045", "UP035", "UP006", "UP037", "UP031", "UP010", "UP004", "UP028",
    "S110", "S112",
    "BLE001",  # broad excepts guard JVM boundaries; reviewed case by case
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "PL", "B", "SIM", "TRY", "E731", "RUF", "T20"]

[tool.ruff.lint.isort]
known-first-party = ["ghidra_mcp", "ghidra_headless"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
