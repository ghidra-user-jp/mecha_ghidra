[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ghidra-mcp"
version = "0.1.4rc1"
description = "PyGhidra ベースの Ghidra MCP サーバー"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "mcp>=1.27.2,<2",
    "pyghidra>=2.0.0",
    "fasteners>=0.19",
    "pydantic>=2.11,<3",
    "regex>=2024.4.16",
]

[project.urls]
Homepage = "https://github.com/ghidra-user-jp/mecha_ghidra"
Repository = "https://github.com/ghidra-user-jp/mecha_ghidra"
Documentation = "https://github.com/ghidra-user-jp/mecha_ghidra/blob/main/docs/usage.md"
Issues = "https://github.com/ghidra-user-jp/mecha_ghidra/issues"

[project.scripts]
ghidra-mcp = "ghidra_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
managed = true

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-mock>=3",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
