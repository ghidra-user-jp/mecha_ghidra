[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ghidra-mcp"
version = "0.1.2"
description = "PyGhidra ベースの Ghidra MCP サーバー"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.27.2,<2",
    "pyghidra>=2.0.0",
    "fasteners>=0.19",
    "pydantic>=2.11,<3",
    "regex>=2024.4.16",
]

[project.scripts]
ghidra-mcp = "ghidra_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
managed = true

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-mock>=3",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
