name: release-linux-arm64-decompiler

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  release:
    types:
      - published

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-linux-arm64-decompiler:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            git \
            unzip \
            zip \
            tar \
            build-essential \
            bison \
            flex \
            file \
            openjdk-21-jdk-headless \
            python3

      - name: Make scripts executable
        run: chmod +x scripts/build_linux_arm64_decompiler.sh

      - name: Build linux_arm_64 overlay and patched distribution
        run: ./scripts/build_linux_arm64_decompiler.sh --no-docker --output-dir dist

      - name: Verify overlay contents
        run: |
          overlay="$(find dist -maxdepth 1 -type f -name '*linux_arm_64_decompiler_overlay.tar.gz' | head -n 1)"
          test -n "${overlay}"
          tar -tzf "${overlay}" | grep '^Ghidra/Features/Decompiler/os/linux_arm_64/decompile$'
          tar -tzf "${overlay}" | grep '^Ghidra/Features/Decompiler/os/linux_arm_64/sleigh$'

      - name: Verify patched distribution contents
        run: |
          patched_zip="$(find dist -maxdepth 1 -type f -name '*linux_arm_64_decompiler.zip' | head -n 1)"
          test -n "${patched_zip}"
          unzip -Z1 "${patched_zip}" | grep '/Ghidra/Features/Decompiler/os/linux_arm_64/decompile$'
          unzip -Z1 "${patched_zip}" | grep '/Ghidra/Features/Decompiler/os/linux_arm_64/sleigh$'

      - name: Prepare user-facing release assets
        run: |
          set -eu
          . ./scripts/ghidra_release.env
          mkdir -p release-assets

          overlay="$(find dist -maxdepth 1 -type f -name '*linux_arm_64_decompiler_overlay.tar.gz' | head -n 1)"
          patched_zip="$(find dist -maxdepth 1 -type f -name '*linux_arm_64_decompiler.zip' | head -n 1)"
          test -n "${overlay}"
          test -n "${patched_zip}"

          cp "${overlay}" "release-assets/${MECHA_GHIDRA_RELEASE_ARM64_OVERLAY_BASENAME}"

          cp "${patched_zip}" "release-assets/${MECHA_GHIDRA_RELEASE_ARM64_PATCHED_DIST_BASENAME}"

      - name: Verify user-facing release assets
        run: |
          set -eu
          . ./scripts/ghidra_release.env
          test -f "release-assets/${MECHA_GHIDRA_RELEASE_ARM64_OVERLAY_BASENAME}"
          test -f "release-assets/${MECHA_GHIDRA_RELEASE_ARM64_PATCHED_DIST_BASENAME}"

      - name: Prepare release body
        run: |
          set -eu
          . ./scripts/ghidra_release.env
          patched_sha256="$(sha256sum "release-assets/${MECHA_GHIDRA_RELEASE_ARM64_PATCHED_DIST_BASENAME}" | awk '{print $1}')"
          overlay_sha256="$(sha256sum "release-assets/${MECHA_GHIDRA_RELEASE_ARM64_OVERLAY_BASENAME}" | awk '{print $1}')"
          cat > release-body.md <<EOF
          ## Release Assets

          - \`${MECHA_GHIDRA_RELEASE_ARM64_PATCHED_DIST_BASENAME}\`
            Patched Ghidra bundle for Apple Silicon / Linux ARM64 Docker use.
            This is not the normal source code ZIP.
            SHA-256: \`${patched_sha256}\`

          - \`${MECHA_GHIDRA_RELEASE_ARM64_OVERLAY_BASENAME}\`
            linux_arm_64 decompiler overlay for an existing Ghidra installation.
            SHA-256: \`${overlay_sha256}\`

          GitHub's built-in \`Source code (zip)\` and \`Source code (tar.gz)\`
          links are the normal source code snapshots for this repository.

          Separate \`.sha256\` release assets are no longer published.
          The SHA-256 values are listed in this release body instead.
          EOF

      - name: Remove legacy release assets
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -eu
          status_code="$(curl -sSL -o release.json -w '%{http_code}' \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          if [ "${status_code}" = "404" ]; then
            echo "No existing release found for tag ${RELEASE_TAG}; skipping legacy asset cleanup."
            exit 0
          fi
          [ "${status_code}" = "200" ]
          RELEASE_JSON="$(cat release.json)" python3 - <<'PY'
          import fnmatch
          import json
          import os
          import subprocess

          payload = json.loads(os.environ["RELEASE_JSON"])
          delete_patterns = [
              "*.sha256",
              "mecha_ghidra_release_assets.txt",
              "mecha_ghidra_source_code.zip",
              "mecha_ghidra_docker_arm64_*.zip",
              "mecha_ghidra_docker_arm64_*.tar.gz",
              "ghidra_*_linux_arm_64_decompiler.zip",
              "ghidra_*_linux_arm_64_decompiler_overlay.tar.gz",
          ]
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]

          for asset in payload.get("assets", []):
              name = asset.get("name", "")
              if not any(fnmatch.fnmatch(name, pattern) for pattern in delete_patterns):
                  continue
              asset_id = asset["id"]
              url = f"https://api.github.com/repos/{repo}/releases/assets/{asset_id}"
              subprocess.run(
                  [
                      "curl",
                      "-fsSL",
                      "-X",
                      "DELETE",
                      "-H",
                      f"Authorization: Bearer {token}",
                      "-H",
                      "Accept: application/vnd.github+json",
                      url,
                  ],
                  check=True,
              )
              print(f"Deleted legacy release asset: {name}")
          PY

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mecha-ghidra-release-assets
          if-no-files-found: error
          path: |
            release-assets/*

      - name: Publish release assets for tag pushes
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
          body_path: release-body.md

      - name: Publish release assets for published releases
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
          body_path: release-body.md
