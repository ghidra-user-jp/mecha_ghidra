name: release-decompiler-natives

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-decompiler-natives-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test_package:
    name: Test and build Python package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      is_prerelease: ${{ steps.version_check.outputs.is_prerelease }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.11.2

      - name: Verify lockfile and install test dependencies
        run: |
          uv lock --check
          uv sync --frozen --extra test

      - name: Verify release tag matches package version
        id: version_check
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          uv run --frozen python - "${RELEASE_TAG}" <<'PY'
          import os
          import subprocess
          import sys

          from packaging.version import InvalidVersion, Version

          tag = sys.argv[1]
          if not tag.startswith("v"):
              raise SystemExit(f"Release tag must start with 'v': {tag}")
          try:
              tag_version = Version(tag[1:])
          except InvalidVersion as exc:
              raise SystemExit(f"Release tag is not a valid version: {tag}") from exc
          package_version = Version(
              subprocess.check_output(["uv", "version", "--short"], text=True).strip()
          )
          if tag_version != package_version:
              raise SystemExit(
                  f"Release tag {tag} does not match package version {package_version}"
              )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"is_prerelease={str(tag_version.is_prerelease).lower()}\n")
          print(f"Release tag and package version match: {package_version}")
          PY

      - name: Run unit tests
        run: uv run pytest -q

      - name: Compile and build distributions
        run: |
          uv run python -m compileall -q src
          uv build --out-dir package-dist

      - name: Verify Python package version and license metadata
        run: |
          uv run --frozen python - <<'PY'
          from email.parser import BytesParser
          from pathlib import Path
          import subprocess
          import tarfile
          import zipfile

          expected_version = subprocess.check_output(
              ["uv", "version", "--short"], text=True
          ).strip()
          expected_license = Path("LICENSE").read_bytes()
          wheels = list(Path("package-dist").glob("*.whl"))
          sdists = list(Path("package-dist").glob("*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit(
                  f"Expected one wheel and one sdist, got {wheels=} {sdists=}"
              )

          with zipfile.ZipFile(wheels[0]) as archive:
              metadata_names = [
                  name for name in archive.namelist() if name.endswith(".dist-info/METADATA")
              ]
              license_names = [
                  name
                  for name in archive.namelist()
                  if name.endswith(".dist-info/licenses/LICENSE")
              ]
              if len(metadata_names) != 1 or len(license_names) != 1:
                  raise SystemExit("Wheel is missing unique METADATA or LICENSE entries")
              metadata = BytesParser().parsebytes(archive.read(metadata_names[0]))
              if metadata.get("Version") != expected_version:
                  raise SystemExit(
                      f"Wheel version {metadata.get('Version')} != {expected_version}"
                  )
              if metadata.get("License-Expression") != "Apache-2.0":
                  raise SystemExit(
                      "Wheel License-Expression is not Apache-2.0: "
                      f"{metadata.get('License-Expression')}"
                  )
              if archive.read(license_names[0]) != expected_license:
                  raise SystemExit("Wheel LICENSE does not match the repository LICENSE")

          with tarfile.open(sdists[0], "r:gz") as archive:
              license_members = [
                  member
                  for member in archive.getmembers()
                  if member.isfile() and member.name.endswith("/LICENSE")
              ]
              if len(license_members) != 1:
                  raise SystemExit("Source distribution is missing a unique LICENSE")
              license_file = archive.extractfile(license_members[0])
              if license_file is None or license_file.read() != expected_license:
                  raise SystemExit("Source distribution LICENSE does not match")

          print(f"Verified package version {expected_version} and Apache-2.0 licensing")
          PY

      - name: Upload Python package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghidra-mcp-python-package
          if-no-files-found: error
          path: package-dist/*

  build-decompiler:
    name: Build ${{ matrix.platform }} decompiler
    needs: test_package
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux_arm_64
            runs_on: ubuntu-24.04-arm
            build_mode: --docker
          - platform: mac_arm_64
            runs_on: macos-15
            build_mode: --no-docker
          - platform: mac_x86_64
            runs_on: macos-15-intel
            build_mode: --no-docker
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Java for macOS native builds
        if: runner.os == 'macOS'
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Make scripts executable
        run: chmod +x scripts/build_decompiler_natives.sh scripts/build_linux_arm64_decompiler.sh

      - name: Build decompiler overlay
        env:
          DOCKER_IMAGE: eclipse-temurin:21-jdk-jammy
        run: ./scripts/build_decompiler_natives.sh --platform "${{ matrix.platform }}" "${{ matrix.build_mode }}" --no-patched-dist --output-dir dist

      - name: Verify overlay contents
        run: |
          overlay="$(find dist -type f -name "*${{ matrix.platform }}_decompiler_overlay.tar.gz" | head -n 1)"
          test -n "${overlay}"
          tar -tzf "${overlay}" | grep "^Ghidra/Features/Decompiler/os/${{ matrix.platform }}/decompile$"
          tar -tzf "${overlay}" | grep "^Ghidra/Features/Decompiler/os/${{ matrix.platform }}/sleigh$"
          tar -tzf "${overlay}" | grep '^LICENSE$'
          tar -tzf "${overlay}" | grep '^NOTICE$'
          tar -tzf "${overlay}" | grep '^DISCLAIMER.md$'
          tar -tzf "${overlay}" | grep '^licenses/zlib_License.txt$'

      - name: Verify binaries run on Ubuntu 22.04
        if: runner.os == 'Linux'
        run: |
          set -eu
          overlay="$(find dist -type f -name "*${{ matrix.platform }}_decompiler_overlay.tar.gz" | head -n 1)"
          test -n "${overlay}"
          verify_dir="$(mktemp -d)"
          trap 'rm -rf "${verify_dir}"' EXIT
          tar -xzf "${overlay}" -C "${verify_dir}"
          docker run --rm --platform linux/arm64 \
            -v "${verify_dir}:/overlay:ro" \
            ubuntu:22.04 \
            bash -ec '
              apt-get update >/dev/null
              apt-get install -y --no-install-recommends libstdc++6 >/dev/null
              for binary in decompile sleigh; do
                path="/overlay/Ghidra/Features/Decompiler/os/linux_arm_64/${binary}"
                output="$("${path}" 2>&1 || true)"
                if printf "%s\n" "${output}" | grep -Eq "GLIBC(X{2})?_[0-9.]+.*not found"; then
                  printf "%s\n" "${output}" >&2
                  exit 1
                fi
              done
            '

      - name: Upload platform artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: decompiler-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            dist/*

  publish-release-assets:
    name: Publish decompiler release assets
    needs: [test_package, build-decompiler]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Download platform artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: decompiler-*
          path: platform-artifacts

      - name: Download Python package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ghidra-mcp-python-package
          path: python-package-artifacts

      - name: Resolve pinned native asset run
        id: native_asset_source
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -eu
          . ./scripts/ghidra_release.env
          echo "run_id=${MECHA_GHIDRA_RELEASE_NATIVE_ASSET_RUN_ID}" >> "${GITHUB_OUTPUT}"

      - name: Download pinned native release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: mecha-ghidra-release-assets
          path: pinned-native-assets
          github-token: ${{ github.token }}
          run-id: ${{ steps.native_asset_source.outputs.run_id }}

      - name: Prepare user-facing release assets
        run: |
          set -eu
          . ./scripts/ghidra_release.env
          mkdir -p release-assets
          cp python-package-artifacts/ghidra_mcp-*.tar.gz release-assets/

          # Native ZIPs for a tag are copied from the verified pre-release run
          # in the next step. Avoid downloading and repacking Ghidra a second time.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            exit 0
          fi

          mkdir -p release-assets/decompiler-natives
          for overlay in \
            "$(find platform-artifacts -type f -name '*linux_arm_64_decompiler_overlay.tar.gz' | head -n 1)" \
            "$(find platform-artifacts -type f -name '*mac_arm_64_decompiler_overlay.tar.gz' | head -n 1)" \
            "$(find platform-artifacts -type f -name '*mac_x86_64_decompiler_overlay.tar.gz' | head -n 1)"
          do
            test -n "${overlay}"
            tar -xzf "${overlay}" -C release-assets/decompiler-natives
          done

          (
            cd release-assets/decompiler-natives
            zip -qr "../${MECHA_GHIDRA_RELEASE_DECOMPILER_NATIVES_ZIP_BASENAME}" \
              Ghidra LICENSE NOTICE DISCLAIMER.md licenses
          )
          rm -rf release-assets/decompiler-natives

          mkdir -p release-assets/full-ghidra
          curl -L "${MECHA_GHIDRA_GHIDRA_DIST_URL}" -o release-assets/full-ghidra/${MECHA_GHIDRA_GHIDRA_DIST_FILENAME}
          echo "${MECHA_GHIDRA_GHIDRA_DIST_SHA256}  release-assets/full-ghidra/${MECHA_GHIDRA_GHIDRA_DIST_FILENAME}" | sha256sum -c -
          unzip -q "release-assets/full-ghidra/${MECHA_GHIDRA_GHIDRA_DIST_FILENAME}" -d release-assets/full-ghidra
          ghidra_dir="$(find release-assets/full-ghidra -mindepth 1 -maxdepth 1 -type d -name 'ghidra_*' | head -n 1)"
          test -n "${ghidra_dir}"
          # The overlay intentionally carries the same upstream LICENSE as the
          # official distribution, so overwrite that identical file without an
          # interactive unzip prompt while adding NOTICE and module licenses.
          unzip -oq "release-assets/${MECHA_GHIDRA_RELEASE_DECOMPILER_NATIVES_ZIP_BASENAME}" -d "${ghidra_dir}"
          (
            cd release-assets/full-ghidra
            zip -qr "../${MECHA_GHIDRA_RELEASE_PATCHED_GHIDRA_ZIP_BASENAME}" "$(basename "${ghidra_dir}")"
          )
          rm -rf release-assets/full-ghidra

      - name: Pin tag release to the verified native archives
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -eu
          . ./scripts/ghidra_release.env
          cp \
            "pinned-native-assets/${MECHA_GHIDRA_RELEASE_DECOMPILER_NATIVES_ZIP_BASENAME}" \
            "release-assets/${MECHA_GHIDRA_RELEASE_DECOMPILER_NATIVES_ZIP_BASENAME}"
          cp \
            "pinned-native-assets/${MECHA_GHIDRA_RELEASE_PATCHED_GHIDRA_ZIP_BASENAME}" \
            "release-assets/${MECHA_GHIDRA_RELEASE_PATCHED_GHIDRA_ZIP_BASENAME}"
          echo "${MECHA_GHIDRA_DECOMPILER_NATIVES_SHA256}  release-assets/${MECHA_GHIDRA_RELEASE_DECOMPILER_NATIVES_ZIP_BASENAME}" | sha256sum -c -
          echo "${MECHA_GHIDRA_RELEASE_PATCHED_GHIDRA_SHA256}  release-assets/${MECHA_GHIDRA_RELEASE_PATCHED_GHIDRA_ZIP_BASENAME}" | sha256sum -c -

      - name: Verify user-facing release assets
        run: |
          set -eu
          . ./scripts/ghidra_release.env
          zip_path="release-assets/${MECHA_GHIDRA_RELEASE_DECOMPILER_NATIVES_ZIP_BASENAME}"
          full_zip_path="release-assets/${MECHA_GHIDRA_RELEASE_PATCHED_GHIDRA_ZIP_BASENAME}"
          test -f "${zip_path}"
          test -f "${full_zip_path}"
          test "$(find release-assets -maxdepth 1 -type f -name 'ghidra_mcp-*.whl' | wc -l)" -eq 0
          test "$(find release-assets -maxdepth 1 -type f -name 'ghidra_mcp-*.tar.gz' | wc -l)" -eq 1
          unzip -Z1 "${zip_path}" | grep '^Ghidra/Features/Decompiler/os/linux_arm_64/decompile$'
          unzip -Z1 "${zip_path}" | grep '^Ghidra/Features/Decompiler/os/linux_arm_64/sleigh$'
          unzip -Z1 "${zip_path}" | grep '^Ghidra/Features/Decompiler/os/mac_arm_64/decompile$'
          unzip -Z1 "${zip_path}" | grep '^Ghidra/Features/Decompiler/os/mac_arm_64/sleigh$'
          unzip -Z1 "${zip_path}" | grep '^Ghidra/Features/Decompiler/os/mac_x86_64/decompile$'
          unzip -Z1 "${zip_path}" | grep '^Ghidra/Features/Decompiler/os/mac_x86_64/sleigh$'
          unzip -Z1 "${zip_path}" | grep '^LICENSE$'
          unzip -Z1 "${zip_path}" | grep '^NOTICE$'
          unzip -Z1 "${zip_path}" | grep '^DISCLAIMER.md$'
          unzip -Z1 "${zip_path}" | grep '^licenses/zlib_License.txt$'
          unzip -Z1 "${full_zip_path}" | grep "^${MECHA_GHIDRA_GHIDRA_DIST_ROOT}/Ghidra/Features/Decompiler/os/linux_arm_64/decompile$"
          unzip -Z1 "${full_zip_path}" | grep "^${MECHA_GHIDRA_GHIDRA_DIST_ROOT}/Ghidra/Features/Decompiler/os/linux_arm_64/sleigh$"
          unzip -Z1 "${full_zip_path}" | grep "^${MECHA_GHIDRA_GHIDRA_DIST_ROOT}/Ghidra/Features/Decompiler/os/mac_arm_64/decompile$"
          unzip -Z1 "${full_zip_path}" | grep "^${MECHA_GHIDRA_GHIDRA_DIST_ROOT}/Ghidra/Features/Decompiler/os/mac_arm_64/sleigh$"
          unzip -Z1 "${full_zip_path}" | grep "^${MECHA_GHIDRA_GHIDRA_DIST_ROOT}/Ghidra/Features/Decompiler/os/mac_x86_64/decompile$"
          unzip -Z1 "${full_zip_path}" | grep "^${MECHA_GHIDRA_GHIDRA_DIST_ROOT}/Ghidra/Features/Decompiler/os/mac_x86_64/sleigh$"

      - name: Prepare release body
        run: |
          set -eu
          . ./scripts/ghidra_release.env
          zip_path="release-assets/${MECHA_GHIDRA_RELEASE_DECOMPILER_NATIVES_ZIP_BASENAME}"
          full_zip_path="release-assets/${MECHA_GHIDRA_RELEASE_PATCHED_GHIDRA_ZIP_BASENAME}"
          sdist_path="$(find release-assets -maxdepth 1 -type f -name 'ghidra_mcp-*.tar.gz' | head -n 1)"
          test -n "${sdist_path}"
          sdist_name="$(basename "${sdist_path}")"
          cat > release-body.md <<EOF
          ## Python package

          This release includes the tested \`ghidra_mcp\` source distribution built from this tag.

          - \`${sdist_name}\`

          ## Native decompiler binaries

          This release provides two ZIP assets:

          - \`${MECHA_GHIDRA_RELEASE_PATCHED_GHIDRA_ZIP_BASENAME}\`
            Ready-to-use Ghidra ${MECHA_GHIDRA_GHIDRA_VERSION} distribution with Linux ARM64 and macOS native \`decompile\` / \`sleigh\` binaries already included.
            Extract this ZIP and run Ghidra from the extracted \`${MECHA_GHIDRA_GHIDRA_DIST_ROOT}\` directory.

          - \`${MECHA_GHIDRA_RELEASE_DECOMPILER_NATIVES_ZIP_BASENAME}\`
            Overlay ZIP containing Linux ARM64 and macOS native \`decompile\` / \`sleigh\` binaries and required upstream license notices.
            Extract it at the root of an existing Ghidra ${MECHA_GHIDRA_GHIDRA_VERSION} installation.
            Files are already stored under their final \`Ghidra/Features/Decompiler/os/...\` paths inside the ZIP.

          Added native paths:

          - \`Ghidra/Features/Decompiler/os/linux_arm_64/decompile\`
          - \`Ghidra/Features/Decompiler/os/linux_arm_64/sleigh\`
          - \`Ghidra/Features/Decompiler/os/mac_arm_64/decompile\`
          - \`Ghidra/Features/Decompiler/os/mac_arm_64/sleigh\`
          - \`Ghidra/Features/Decompiler/os/mac_x86_64/decompile\`
          - \`Ghidra/Features/Decompiler/os/mac_x86_64/sleigh\`

          The native archives include Ghidra's upstream \`LICENSE\`, \`NOTICE\`,
          \`DISCLAIMER.md\`, and the Decompiler module's applicable third-party
          zlib license. The mecha_ghidra Python package is licensed under
          Apache License 2.0.

          The upstream Ghidra ${MECHA_GHIDRA_GHIDRA_VERSION} ZIP does not include these three native platform directories; this release adds them from the matching Ghidra source tag.
          EOF

      - name: Look up existing release
        id: release_lookup
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -eu
          status_code="$(curl -sSL -o release.json -w '%{http_code}' \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          if [ "${status_code}" = "404" ]; then
            echo "No existing release found for tag ${RELEASE_TAG}; skipping legacy asset cleanup."
            echo "release_exists=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          [ "${status_code}" = "200" ]
          echo "release_exists=true" >> "${GITHUB_OUTPUT}"
          python3 - <<'PY'
          import json
          import os

          with open("release.json", encoding="utf-8") as release_file:
              release = json.load(release_file)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"release_is_draft={str(bool(release.get('draft'))).lower()}\n")
          PY

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mecha-ghidra-release-assets
          if-no-files-found: error
          path: |
            release-assets/*

      - name: Create release after all gates pass
        if: startsWith(github.ref, 'refs/tags/') && steps.release_lookup.outputs.release_exists != 'true'
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3
        with:
          files: |
            release-assets/*
          body_path: release-body.md
          generate_release_notes: true
          prerelease: ${{ needs.test_package.outputs.is_prerelease }}
          fail_on_unmatched_files: true

      - name: Update assets without replacing an existing release body
        if: startsWith(github.ref, 'refs/tags/') && steps.release_lookup.outputs.release_exists == 'true'
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3
        with:
          files: |
            release-assets/*
          draft: ${{ steps.release_lookup.outputs.release_is_draft }}
          prerelease: ${{ needs.test_package.outputs.is_prerelease }}
          fail_on_unmatched_files: true

      - name: Remove superseded legacy release assets
        if: startsWith(github.ref, 'refs/tags/') && steps.release_lookup.outputs.release_exists == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -eu
          python3 - <<'PY'
          import fnmatch
          import json
          import os
          import subprocess
          from pathlib import Path

          with open("release.json", encoding="utf-8") as release_file:
              payload = json.load(release_file)
          delete_patterns = [
              "*.sha256",
              "mecha_ghidra_release_assets.txt",
              "mecha_ghidra_source_code.zip",
              "ghidra_decompiler_natives_all.zip",
              "ghidra_*_decompiler_natives_all.zip",
              "mecha_ghidra_decompiler_natives_all.zip",
              "mecha_ghidra_ghidra_*_decompiler_natives_all.zip",
              "mecha_ghidra_docker_arm64_*.zip",
              "mecha_ghidra_docker_arm64_*.tar.gz",
              "mecha_ghidra_macos_*.zip",
              "mecha_ghidra_macos_*.tar.gz",
              "ghidra_*_linux_arm_64_decompiler.zip",
              "ghidra_*_linux_arm_64_decompiler_overlay.tar.gz",
              "ghidra_*_mac_arm_64_decompiler.zip",
              "ghidra_*_mac_arm_64_decompiler_overlay.tar.gz",
              "ghidra_*_mac_x86_64_decompiler.zip",
              "ghidra_*_mac_x86_64_decompiler_overlay.tar.gz",
              "ghidra_mcp-*.whl",
          ]
          new_asset_names = {
              path.name for path in Path("release-assets").iterdir() if path.is_file()
          }
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]

          for asset in payload.get("assets", []):
              name = asset.get("name", "")
              if name in new_asset_names:
                  continue
              if not any(fnmatch.fnmatch(name, pattern) for pattern in delete_patterns):
                  continue
              asset_id = asset["id"]
              url = f"https://api.github.com/repos/{repo}/releases/assets/{asset_id}"
              subprocess.run(
                  [
                      "curl",
                      "-fsSL",
                      "-X",
                      "DELETE",
                      "-H",
                      f"Authorization: Bearer {token}",
                      "-H",
                      "Accept: application/vnd.github+json",
                      url,
                  ],
                  check=True,
              )
              print(f"Deleted legacy release asset: {name}")
          PY
